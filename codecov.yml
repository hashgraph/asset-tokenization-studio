# Always comment on PRs
comment:
  layout: "diff, flags, files"
  behavior: new # deletes old comment and posts a new one
  require_changes: false

coverage:
  status:
    patch:
      default:
        target: auto
        threshold: 0%
        if_ci_failed: error
    project:
      default:
        target: auto
        threshold: 0%
        if_ci_failed: error # don't report success if the test job itself failed
        informational: false # blocking status, not advisory (this is the default — explicit here)

ignore:
  - "packages/*/dist"
