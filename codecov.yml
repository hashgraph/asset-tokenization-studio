# Always comment on PRs
comment:
  layout: "diff, flags, files"
  behavior: new # deletes old comment and posts a new one
  require_changes: false

coverage:
  status:
    patch:
      default:
        target: auto
        threshold: 0%
    project:
      default:
        target: auto
        threshold: 0%

ignore:
  - "packages/*/dist"
