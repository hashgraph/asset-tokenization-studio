name: "001: [FLOW] PR Formatting"

# pull_request_target is kept on purpose so title/assignee checks also run (with a
# usable token) for PRs from forks. It is safe here because this workflow NEVER
# checks out or executes PR code: it only reads PR metadata from the event
# payload / API, passes it through env (never inlined into a script), and uses
# no repository secrets beyond the job-scoped GITHUB_TOKEN. Do not add an
# actions/checkout of the PR head, npm install, or any script from the PR here.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no PR code is checked out or run (see above)
    # This covers: new PRs, title edits, new commits, and assignee changes - everything the workflow actually validates
    types:
      - assigned
      - unassigned
      - opened
      - reopened
      - edited
      - synchronize

defaults:
  run:
    shell: bash

# Nothing by default; each job asks for only what it needs.
permissions: {}

jobs:
  title-check:
    name: Title Check
    runs-on: token-studio-linux-medium
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the PR title
      statuses: write # the action can report a commit status
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Check PR Title
        uses: step-security/action-semantic-pull-request@bc0cf74f5be4ce34accdec1ae908dff38dc5def1 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assignee-check:
    name: Assignee Check
    runs-on: token-studio-linux-medium
    timeout-minutes: 5
    permissions: {} # reads the event payload only
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Check Assignee
        env:
          ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees) }}
        run: |
          if [[ "${ASSIGNEES}" == "[]" ]] || [[ "${ASSIGNEES}" == "null" ]]; then
            echo "❌ Assignee is not set. At least one assignee is required."
            exit 1
          fi
          echo "✅ Assignees configured."
