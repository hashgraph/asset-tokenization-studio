name: "100: [FLOW] ATS Tests"

on:
  push:
    branches: [main, feat/workflow_coverage_control_development]
  pull_request:
    paths:
      - "packages/ats/**"
      - "apps/ats/**"
      - "package.json"
      - "codecov.yml"
      - ".github/workflows/*ats*.yaml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  checks: read # gate step reads the codecov/project and codecov/patch check-runs

jobs:
  test-ats:
    name: testing
    runs-on: token-studio-linux-large
    timeout-minutes: 60
    env:
      CONTRACT_SIZER_RUN_ON_COMPILE: "false"
      REPORT_GAS: "false"
      CLIENT_PRIVATE_KEY_ECDSA_1: ${{ secrets.CLIENT_PRIVATE_KEY_ECDSA_1 }}
      CLIENT_PUBLIC_KEY_ECDSA_1: ${{ secrets.CLIENT_PUBLIC_KEY_ECDSA_1 }}
      CLIENT_ACCOUNT_ID_ECDSA_1: "0.0.1328"
      CLIENT_EVM_ADDRESS_ECDSA_1_CORRECT: "0x97C50bb12E1C6284cF2855cdba95c5D60AEE44CF"
      CLIENT_EVM_ADDRESS_ECDSA_1: "0x0000000000000000000000000000000000000530"
      CLIENT_PRIVATE_KEY_ECDSA_2: ${{ secrets.CLIENT_PRIVATE_KEY_ECDSA_2 }}
      CLIENT_PUBLIC_KEY_ECDSA_2: ${{ secrets.CLIENT_PUBLIC_KEY_ECDSA_2 }}
      CLIENT_ACCOUNT_ID_ECDSA_2: "0.0.2168740"
      CLIENT_EVM_ADDRESS_ECDSA_2: "0x00000000000000000000000000000000002117A4"
      FACTORY_ADDRESS: "0.0.5480051"
      RESOLVER_ADDRESS: "0.0.5479997"
      FIREBLOCKS_HEDERA_ACCOUNT_ID: "0.0.2168740"
      FIREBLOCKS_HEDERA_PUBLIC_KEY: ${{ secrets.CLIENT_PUBLIC_KEY_ECDSA_2 }}
      DFNS_HEDERA_ACCOUNT_ID: "0.0.2168740"
      DFNS_WALLET_PUBLIC_KEY: ${{ secrets.CLIENT_PUBLIC_KEY_ECDSA_2 }}
      AWS_KMS_HEDERA_ACCOUNT_ID: "0.0.4394946"
      AWS_KMS_HEDERA_PUBLIC_KEY: "302d300706052b8104000a03220003ee815bb9b5e53f5dbe7264a77e586127dfcb75da8c1246f5aa6ededdb13e6c21"
      REACT_APP_MIRROR_NODE: "https://testnet.mirrornode.hedera.com/api/v1/"
      REACT_APP_RPC_NODE: "https://testnet.hashio.io/api"
      REACT_APP_RESOLVER: "0.0.5479997"
      REACT_APP_FACTORY: "0.0.5480051"
      REACT_APP_SHOW_DISCLAIMER: "true"
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup NodeJS Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm run ats:install

      # BBND-1766: `atsRegistry.generated.ts` is gitignored and regenerated
      # by the contracts package's `prepare` script during `npm ci`. This
      # step is the clean-checkout guard for that contract — if the file is
      # missing after install, `prepare` regressed and every downstream
      # build / test step would fail with a confusing module-not-found.
      - name: Verify auto-generated registry produced by prepare hook
        run: |
          REGISTRY_PATH="packages/ats/contracts/scripts/domain/atsRegistry.generated.ts"
          if [[ ! -f "${REGISTRY_PATH}" ]]; then
            echo "::error::${REGISTRY_PATH} missing after npm ci. The contracts package's 'prepare' script (hardhat compile) likely regressed."
            exit 1
          fi
          if ! grep -q "^export const FACET_REGISTRY" "${REGISTRY_PATH}"; then
            echo "::error::${REGISTRY_PATH} missing FACET_REGISTRY export — generator produced a malformed file."
            exit 1
          fi
          echo "✓ ${REGISTRY_PATH} auto-regenerated by prepare hook"

      - name: Build ATS packages
        run: npm run ats:build

      - name: Run ATS tests
        run: npm run ats:test:ci

      - name: Generate coverage report
        id: generate_coverage
        run: npm run ats:contracts:test:coverage

      - name: Upload coverage report
        if: ${{ steps.generate_coverage.outcome == 'success' }}
        uses: codecov/codecov-action@5c47607acb93fed5485fdbf7232e8a31425f672a # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ats

      # Blocking coverage gate. Codecov reports via GitHub *check-runs*
      # (the Status API never surfaced `codecov/project` — see history of
      # this step). codecov.yml marks both `project` and `patch` as
      # informational: false, so both must conclude 'success'. Fails closed:
      # if Codecov hasn't reported by MAX_ATTEMPTS, treat it as a gate
      # failure rather than silently letting the PR through.
      - name: Enforce Codecov coverage gate
        if: ${{ github.event_name == 'pull_request' && steps.generate_coverage.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          EXPECTED_CHECKS: "codecov/project codecov/patch"
          MAX_ATTEMPTS: "40"
          POLL_INTERVAL_SECONDS: "15"
        run: |
          set -euo pipefail
          echo "Waiting for Codecov check-runs on ${HEAD_SHA} in ${REPO}..."

          declare -A seen_conclusion

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "----- attempt ${attempt}/${MAX_ATTEMPTS} -----"

            checks_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
              --jq '.check_runs[] | select(.name | startswith("codecov/"))' 2>/dev/null || echo "")

            if [ -n "${checks_json}" ]; then
              echo "Codecov check-runs found so far:"
              echo "${checks_json}" | jq -r '"  \(.name): status=\(.status) conclusion=\(.conclusion // "pending")"'
            else
              echo "  no codecov/* check-run yet"
            fi

            all_done=true
            for expected in ${EXPECTED_CHECKS}; do
              entry=$(echo "${checks_json}" | jq -s --arg name "${expected}" \
                'map(select(.name == $name)) | sort_by(.started_at) | last // empty')
              if [ -z "${entry}" ] || [ "$(echo "${entry}" | jq -r '.status')" != "completed" ]; then
                all_done=false
                continue
              fi
              seen_conclusion["${expected}"]=$(echo "${entry}" | jq -r '.conclusion')
            done

            if [ "${all_done}" = true ]; then
              break
            fi

            echo "  not all expected checks (${EXPECTED_CHECKS}) completed yet — waiting ${POLL_INTERVAL_SECONDS}s"
            sleep "${POLL_INTERVAL_SECONDS}"
          done

          failed=false
          for expected in ${EXPECTED_CHECKS}; do
            conclusion="${seen_conclusion[${expected}]:-}"
            if [ -z "${conclusion}" ]; then
              echo "::error::Timed out waiting for check-run '${expected}' to complete on ${HEAD_SHA}. Treating this as a coverage-gate failure — check the Codecov PR comment/dashboard, or re-run this job once Codecov has reported."
              failed=true
            elif [ "${conclusion}" != "success" ]; then
              echo "::error::Check-run '${expected}' concluded '${conclusion}' — coverage regressed against the target branch."
              failed=true
            else
              echo "✓ ${expected}: success"
            fi
          done

          if [ "${failed}" = true ]; then
            exit 1
          fi

          echo "All Codecov coverage checks passed."
